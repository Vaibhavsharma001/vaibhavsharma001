
name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Statistics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          base: header
          config_order: base.header

          # Explicitly disable programming language statistics
          plugin_languages: no

      - name: Generate Contribution Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/contributions.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
