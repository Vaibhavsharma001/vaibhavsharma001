
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a2c"/>
      <stop offset="60%" stop-color="#102d48"/>
      <stop offset="100%" stop-color="#090f20"/>
    </linearGradient>

    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6386ad"/>
      <stop offset="100%" stop-color="#142942"/>
    </linearGradient>

    <linearGradient id="textGlow">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a9d9ff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

    <!-- Text readability shadow -->
    <filter id="textShadow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.85" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#c8e6ff" opacity=".8">
    <circle cx="100" cy="50" r="1.5"/>
    <circle cx="260" cy="80" r="1"/>
    <circle cx="480" cy="40" r="1.5"/>
    <circle cx="700" cy="65" r="1"/>
    <circle cx="900" cy="35" r="1.5"/>
    <circle cx="1100" cy="90" r="1"/>
    <circle cx="550" cy="130" r="1"/>
  </g>

  <!-- Japanese moon -->
  <circle cx="970" cy="120" r="95" fill="#ff719b" opacity=".17" filter="url(#glow)"/>
  <circle cx="970" cy="120" r="58" fill="#ff9eb6" opacity=".8"/>

  <!-- Mount Fuji -->
  <path d="M500 290 L780 70 L1060 290 Z" fill="url(#mountain)"/>
  <path d="M780 70 L750 112 L775 104 L790 120 L810 105 L830 125 Z" fill="#e7f1fc"/>

  <!-- Distant mountains -->
  <path d="M330 290 L520 170 L710 290 Z" fill="#152b45"/>
  <path d="M850 290 L1040 175 L1200 290 Z" fill="#152a43"/>

  <!-- Tokyo buildings -->
  <g fill="#071522">
    <rect x="0" y="215" width="80" height="105"/>
    <rect x="90" y="185" width="65" height="135"/>
    <rect x="165" y="225" width="80" height="95"/>
    <rect x="255" y="195" width="70" height="125"/>
    <rect x="1040" y="210" width="70" height="110"/>
    <rect x="1120" y="225" width="80" height="95"/>
  </g>

  <!-- Tokyo Tower -->
  <path d="M175 320 L215 145 L255 320 Z" fill="#152a42"/>
  <path d="M194 245 H236 M200 215 H230 M207 185 H223"
        stroke="#ff789e" stroke-width="3"/>

  <!-- Building lights -->
  <g fill="#65baff">
    <path d="M105 205h6v8h-6z M125 205h6v8h-6z M105 230h6v8h-6z"/>
    <path d="M270 215h6v8h-6z M290 215h6v8h-6z"/>
    <path d="M1055 230h6v8h-6z M1075 230h6v8h-6z"/>
  </g>

  <!-- Animated Sakura petals -->
  <g fill="#ffb5d0" opacity=".85">

    <ellipse cx="150" cy="30" rx="5" ry="3">
      <animate attributeName="cx" values="150;350;150" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;300;30" dur="13s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="450" cy="50" rx="5" ry="3">
      <animate attributeName="cx" values="450;600;450" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;300;50" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1100" cy="40" rx="5" ry="3">
      <animate attributeName="cx" values="1100;900;1100" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;300;40" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="650" cy="20" rx="4" ry="3">
      <animate attributeName="cy" values="20;300;20" dur="17s" repeatCount="indefinite"/>
    </ellipse>

  </g>

  <!-- Name -->
  <text x="75" y="145"
        fill="url(#textGlow)"
        font-family="Arial, sans-serif"
        font-size="47"
        font-weight="bold"
        filter="url(#textShadow)">
    Vaibhav Sharma
  </text>

  <!-- Professional tagline -->
  <text x="78" y="190"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="500"
        filter="url(#textShadow)">
    Python • Backend • Full Stack • AI/GenAI
  </text>

  <!-- Improved visible subtitle -->
  <text x="78" y="225"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="500"
        letter-spacing="0.5"
        filter="url(#textShadow)">
    Building scalable software. Exploring intelligent systems.
  </text>

  <!-- Animated underline -->
  <rect x="78" y="244" width="360" height="5" rx="3" fill="#2f81f7">
    <animate attributeName="width"
             values="80;360;80"
             dur="5s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Animated horizon glow -->
  <path d="M0 290 Q600 270 1200 290"
        fill="none"
        stroke="#398fff"
        stroke-width="2">
    <animate attributeName="opacity"
             values=".2;.9;.2"
             dur="4s"
             repeatCount="indefinite"/>
  </path>

</svg>
