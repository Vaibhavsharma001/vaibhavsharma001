<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#6366f1;#22c55e;#0ea5e9" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0b1020"/>
  <rect width="1200" height="320" fill="url(#g)" opacity="0.35"/>

  <!-- soft blobs -->
  <circle cx="240" cy="90" r="85" fill="#60a5fa" opacity="0.45" filter="url(#blur)">
    <animate attributeName="cx" values="240;300;240" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="210" r="110" fill="#a78bfa" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cy" values="210;170;210" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- grid lines -->
  <g opacity="0.20" stroke="#93c5fd" stroke-width="1">
    <path d="M0 70 H1200"/>
    <path d="M0 140 H1200"/>
    <path d="M0 210 H1200"/>
    <path d="M0 280 H1200"/>
    <path d="M150 0 V320"/>
    <path d="M300 0 V320"/>
    <path d="M450 0 V320"/>
    <path d="M600 0 V320"/>
    <path d="M750 0 V320"/>
    <path d="M900 0 V320"/>
    <path d="M1050 0 V320"/>
  </g>

  <!-- title -->
  <text x="60" y="150" font-family="Inter, Segoe UI, Arial" font-size="44" font-weight="800" fill="#e5e7eb">
    Vaibhav Sharma
  </text>
  <text x="60" y="195" font-family="Inter, Segoe UI, Arial" font-size="20" font-weight="600" fill="#cbd5e1">
    Python • Backend • Full Stack • AI/GenAI
  </text>

  <!-- accent -->
  <rect x="60" y="220" width="340" height="10" rx="6" fill="#2f81f7" opacity="0.85"/>
</svg>
