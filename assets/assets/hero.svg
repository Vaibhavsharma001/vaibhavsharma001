
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071b2b"/>
      <stop offset="55%" stop-color="#102d48"/>
      <stop offset="100%" stop-color="#080e20"/>
    </linearGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#789bbd"/>
      <stop offset="100%" stop-color="#172d49"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0%" stop-color="#ffc4d4"/>
      <stop offset="100%" stop-color="#ff739b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Tokyo night sky -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#d8edff">
    <circle cx="80" cy="48" r="1.5"/>
    <circle cx="220" cy="85" r="1"/>
    <circle cx="400" cy="38" r="1.5"/>
    <circle cx="550" cy="78" r="1"/>
    <circle cx="700" cy="40" r="1.5"/>
    <circle cx="860" cy="65" r="1"/>
    <circle cx="1100" cy="45" r="1.5"/>
    <circle cx="1150" cy="130" r="1"/>
    <circle cx="310" cy="145" r="1"/>
  </g>

  <!-- Glowing Japanese moon -->
  <circle cx="965" cy="115" r="100" fill="#ff739b" opacity=".2" filter="url(#blur)"/>
  <circle cx="965" cy="115" r="58" fill="url(#moon)" opacity=".9"/>

  <!-- Distant mountains -->
  <path d="M350 290 L540 175 L730 290 Z" fill="#172c45"/>
  <path d="M760 290 L970 165 L1200 290 Z" fill="#142a43"/>

  <!-- Mount Fuji -->
  <path d="M540 290 L790 75 L1040 290 Z" fill="url(#fuji)"/>
  <path d="M790 75 L756 116 L778 108 L794 125 L810 108 L827 124 Z" fill="#e0eaf5" opacity=".9"/>

  <!-- Tokyo skyline -->
  <g fill="#071522">
    <rect x="0" y="215" width="75" height="105"/>
    <rect x="82" y="180" width="65" height="140"/>
    <rect x="155" y="225" width="90" height="95"/>
    <rect x="255" y="165" width="70" height="155"/>
    <rect x="335" y="210" width="85" height="110"/>
    <rect x="425" y="230" width="55" height="90"/>
    <rect x="1040" y="200" width="75" height="120"/>
    <rect x="1120" y="220" width="80" height="100"/>
  </g>

  <!-- Tokyo tower -->
  <path d="M180 320 L215 150 L250 320 Z" fill="#182b42"/>
  <path d="M196 245 H234 M201 220 H229 M206 195 H224" stroke="#ff789d" stroke-width="3"/>
  <path d="M215 150 V320" stroke="#ff8eae" stroke-width="2" opacity=".8"/>

  <!-- Building lights -->
  <g fill="#64bdff" opacity=".8">
    <path d="M95 200h6v8h-6z M115 200h6v8h-6z M95 220h6v8h-6z M115 220h6v8h-6z"/>
    <path d="M270 185h6v8h-6z M290 185h6v8h-6z M270 205h6v8h-6z"/>
    <path d="M1055 220h6v8h-6z M1075 220h6v8h-6z M1055 240h6v8h-6z"/>
  </g>

  <!-- Foreground -->
  <path d="M0 285 Q300 270 600 288 T1200 280 V320 H0Z" fill="#071321"/>

  <!-- Sakura petals -->
  <g fill="#ffb5d0" opacity=".85">
    <ellipse cx="130" cy="40" rx="5" ry="3">
      <animate attributeName="cx" values="130;310;480;130" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;160;310;40" dur="14s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 130 40;360 130 40" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="450" cy="20" rx="5" ry="3">
      <animate attributeName="cx" values="450;600;750;450" dur="17s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="20;150;300;20" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1080" cy="50" rx="5" ry="3">
      <animate attributeName="cx" values="1080;930;800;1080" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;170;310;50" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="650" cy="80" rx="4" ry="3">
      <animate attributeName="cy" values="80;310;80" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="650;780;650" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="300" cy="110" rx="4" ry="3">
      <animate attributeName="cy" values="110;300;110" dur="16s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Animated neon horizon -->
  <path d="M0 285 Q600 270 1200 285" fill="none" stroke="#328cff" stroke-width="2">
    <animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
